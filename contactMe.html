        <!--form with username, first+last names, email, site recommend radio, 
        favorite website selection box, rating range element, additional comment textbox, 
        and submit+ 3+ other elements -->
        <div class="feedback">
            <form action="feedback.php">
                <h2>Feedback</h2>
                <p><div class="form-floating mb-3">
                    <input class="form-control" type="text" name="fname" size="16" maxlength="16" placeholder="anonymous" required> 
                    <label for="fname">First Name</label>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" type="text" name="lname" size="16" maxlength="16" placeholder="anonymous" required>
                    <label for="lname">Last Name</label>
                </div></p>
                <p><div class="form-floating mb-3">
                    <input class="form-control" type="email" name="mail" id="email" placeholder="name@domain.com" required>
                    <label for="mail">Email</label>
                </p></div>
                <p><div class="form-floating mb-3">
                    <input class="form-control" type="tel" name="phonenumber" placeholder="xxx-xxx-xxxx" pattern="\d{3}-\d{3}-\d{4}">
                    <label for="phonenumber">Phone Number</label>
                </div></p>
                <p>
                    Recommend site?: 
                    <input class="form-check form-check-input form-check-label" type="radio" name="recommend" value="Yes"> <small>Yes </small>
                    <input class="form-check form-check-input form-check-label" type="radio" name="recommend" value="No">  <small>No </small>
                </p>
                <p>
                    Favorite color?: 
                    <input class="form-control form-control-color" type="color" name="selectcolor" autofocus>
                </p>
                <p>
                    Favorite website?: 
                    <select class="form-select" size="1" name="selectsite" id="selectsite">
                        <option value="google">Google</option>
                        <option value="facebook">Facebook</option>
                        <option value="twitter">Twitter</option>
                        <option value="time">Time</option>
                        <option value="other">Other (Enter Below)</option>
                    </select>
                </p>
                <p><div class="form-floating mb-3">
                    <input class="form-control" type="text" name="userfavsite" size="30" maxlength="30">
                    <label for="userfavsite">Other Favorite Site</label>
                </div></p>
                <p><div class="form-floating">
                    
                    <br><textarea class="form-control" name="comment" id="comment" cols="30" rows="20" placeholder="Enter comments here"></textarea>
                    <label for="comment">Additional Comments</label>
                </div></p>
                <p>
                    Rating: <small>1</small>
                    <input class="form-range" type="range" name="rating" id="rating" min="1" max="10">
                    <small>10</small>
                </p>
                <p>
                    <input type="submit" value="submit">
                </p>
            </form>
        </div>
